name: Build Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/build-requirements.txt

      - name: Validate version and release files
        id: version
        shell: bash
        run: |
          python build_tools/release_metadata.py --write-windows-version
          python build_tools/release_metadata.py --check
          VERSION="$(python build_tools/release_metadata.py --print-version)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python build_tools/release_metadata.py --check-tag "${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build-windows:
    name: Build Windows x86_64
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/build-requirements.txt

      - name: Install Windows Tesseract runtime
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $candidates = @(
            "$env:ProgramFiles\Tesseract-OCR",
            "$env:LOCALAPPDATA\Programs\Tesseract-OCR",
            "C:\Program Files\Tesseract-OCR"
          )
          $home = $candidates | Where-Object { Test-Path (Join-Path $_ "tesseract.exe") } | Select-Object -First 1
          if (-not $home) {
            throw "Chocolatey completed, but tesseract.exe was not found."
          }
          "TESSERACT_HOME=$home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $home "tesseract.exe") --version

      - name: Build and test Windows release
        shell: cmd
        run: build_tools\build_windows.bat

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: MapleStory-Idle-Optimizer-${{ needs.validate.outputs.version }}-Windows-x86_64
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-linux:
    name: Build Linux x86_64
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build and OCR dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-venv python3-tk tesseract-ocr tesseract-ocr-eng
          python3 --version
          tesseract --version | head -n 2

      - name: Build and test Linux release
        shell: bash
        run: ./build_tools/build_linux.sh

      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: MapleStory-Idle-Optimizer-${{ needs.validate.outputs.version }}-Linux-x86_64
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - build-windows
      - build-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "MapleStory Idle Optimizer ${{ needs.validate.outputs.version }}"
